[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pspace"
version = "2.0.0"
description = "Polynomial Chaos Expansion library for uncertainty quantification"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Komahan Boopathy", email = "komahan.cool@gmail.com" }
]
keywords = ["uncertainty quantification", "polynomial chaos", "PCE", "stochastic", "UQ"]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "sympy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/komahanb/pspace"
Repository = "https://github.com/komahanb/pspace"
Issues = "https://github.com/komahanb/pspace/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "demos*"]
